<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Genie Shrine v4</title><style>body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(circle at top,#1a1840,#050816 70%);font-family:Georgia,serif;color:white}#sky{position:fixed;inset:0}.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%}.shoot{position:absolute;width:220px;height:2px;background:linear-gradient(90deg,#fff,transparent);animation:shoot 8s linear infinite}.scene{position:relative;height:100vh;display:flex;align-items:center;justify-content:center}.shrine{width:95vw;height:92vh;position:relative}.dome{position:absolute;top:0;left:50%;transform:translateX(-50%);width:650px;height:260px;border:14px solid gold;border-bottom:none;border-radius:650px 650px 0 0;box-shadow:0 0 40px gold}.pillar{position:absolute;top:130px;width:90px;height:520px;background:linear-gradient(#ffe89a,#b8860b);border-radius:45px;box-shadow:0 0 25px gold}.p1{left:8%}.p2{left:18%}.p3{right:18%}.p4{right:8%}.arch{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:520px;height:500px;background:linear-gradient(#f7dc7c,#af7e0e);border:12px solid gold;border-radius:260px 260px 40px 40px;box-shadow:0 0 40px gold}.stair{position:absolute;left:50%;transform:translateX(-50%);bottom:220px;width:700px;height:140px;background:linear-gradient(#e9c75d,#936a0d);clip-path:polygon(0 100%,100% 100%,85% 0,15% 0)}.genie{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:200px;text-shadow:0 0 30px cyan}.ruby,.ember{position:absolute;width:24px;height:24px;transform:rotate(45deg)}.ruby{background:#b3002d;box-shadow:0 0 20px red}.ember{background:#ff7b00;box-shadow:0 0 20px orange}.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:800px;max-width:90%;padding:18px;background:rgba(0,0,0,.45);border-radius:25px}.panel input{padding:12px;width:260px;border:none;border-radius:12px;margin:4px}.panel button{padding:12px 20px;border:none;border-radius:25px;background:linear-gradient(45deg,purple,gold);color:#fff;font-weight:bold;margin:4px}#result{margin-top:10px;min-height:70px}</style></head><body><div id="sky"></div><div class="scene"><div class="shrine"><div class="dome"></div><div class="pillar p1"></div><div class="pillar p2"></div><div class="pillar p3"></div><div class="pillar p4"></div><div class="stair"></div><div class="arch"><div class="ruby" style="left:50px;top:80px"></div><div class="ruby" style="right:50px;top:80px"></div><div class="ember" style="left:70px;bottom:90px"></div><div class="ember" style="right:70px;bottom:90px"></div><div class="genie">🧞</div></div><div class="panel"><h2>🔮 Grand Celestial Genie Shrine 🔮</h2><input id="name" placeholder="Your Name"><input id="birthday" type="date"><br><button onclick="reveal()">Reveal Destiny</button><button onclick="again()">Try Again</button><div id="result">Your prophecy awaits beneath the stars...</div></div></div></div><script>const p=['A powerful opportunity is drawing near.','Someone important will cross your path soon.','A long-awaited goal will begin to unfold.','An unexpected discovery will bring excitement.','A positive change is approaching faster than expected.'];function reveal(){result.innerHTML='✨ '+(name.value||'Traveler')+', the genie foresees: '+p[Math.floor(Math.random()*p.length)]}function again(){name.value='';birthday.value='';result.innerHTML='Your prophecy awaits beneath the stars...'}for(let i=0;i<220;i++){let s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';sky.appendChild(s)}for(let i=0;i<4;i++){let sh=document.createElement('div');sh.className='shoot';sh.style.top=(10+i*18)+'%';sh.style.animationDelay=(i*2)+'s';sky.appendChild(sh)};</script></body></html>
