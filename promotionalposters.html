<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Promotional Posters</title><link href="https://fonts.googleapis.com/css2?family=Spicy+Rice&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet"><style>:root{--pink:#ff1a75;--white:#fff;--blue:#cce6ff}*{box-sizing:border-box}body{margin:0;background:var(--pink);color:var(--white);font-family:'PT Sans',sans-serif}.wrap{max-width:1600px;margin:auto;padding:32px}.hero{text-align:center;padding:24px 0 48px}.hero h1{font-family:'Spicy Rice',cursive;font-size:clamp(3rem,8vw,6rem);margin:0}.section{margin:40px 0}.panel{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:center}.left,.right{background:rgba(255,255,255,.08);border:3px solid var(--blue);border-radius:32px;padding:18px;transition:.3s}.left:hover,.right:hover{transform:scale(1.02) rotate(.5deg)}.left{grid-column:span 5}.right{grid-column:span 7}.label{font-family:'Spicy Rice',cursive;color:var(--blue);font-size:2rem;text-align:center;margin:0 0 12px}.type{font-family:'Spicy Rice',cursive;font-size:3rem;text-align:center;margin:0 0 24px}.img{width:100%;display:block;border-radius:20px}.divider{text-align:center;font-size:2rem;color:var(--blue);padding:18px 0}@media(max-width:900px){.panel{grid-template-columns:repeat(2,1fr)}.left,.right{grid-column:span 2}.type{font-size:2rem}}</style></head><body><div class="wrap"><div class="hero"><h1>Promotional Posters</h1></div><section class="section"><h2 class="type">Tour Poster</h2><div class="panel"><div class="left"><div class="label">Before</div><img class="img" src="poster.jpg" alt="before"></div><div class="right"><div class="label">After</div><img class="img" src="bandposter.jpg" alt="after"></div></div></section><div class="divider">✦</div><section class="section"><h2 class="type">Movie Poster</h2><div class="panel"><div class="left"><div class="label">Before</div><img class="img" src="poster2.jpg" alt="before"></div><div class="right"><div class="label">After</div><img class="img" src="movieposter.jpg" alt="after"></div></div></section></div></body></html>
