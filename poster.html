<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Afisha Poster Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-ui: #0c0c0f;
      --panel-bg: #141419;
      --border-color: #242430;
      --accent: #5e6ad2;
      --text-main: #f0f0f5;
      --text-muted: #8b8b9e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-ui);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    aside {
      width: 380px;
      min-width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 22px;
      gap: 15px;
      overflow-y: auto;
      z-index: 10;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #fff;
    }

    .desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: -8px;
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 2px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .control-label span {
      color: var(--text-muted);
      font-feature-settings: "tnum";
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: #2b2b36;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid var(--border-color);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2b2b36;
      transition: 0.2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
    }

    button {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #24242e;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button:hover { filter: brightness(1.15); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #08080a;
      overflow: hidden;
      position: relative;
    }

    .poster-container {
      height: 97%;
      aspect-ratio: 1 / 1.414;
      box-shadow: 0 24px 70px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.08);
      display: flex;
      background: #000;
      position: relative;
    }

    #poster-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <aside>
    <div>
      <h1>Afisha Poster Generator</h1>
    </div>

    <div class="section-title">Shape Proportions & Sizing</div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-shape-width">Shape Width Expansion</label>
        <span id="val-shape-width">1.22</span>
      </div>
      <input type="range" id="param-shape-width" min="1.0" max="1.6" step="0.02" value="1.22">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-shape-height">Shape Overall Scale</label>
        <span id="val-shape-height">1.12</span>
      </div>
      <input type="range" id="param-shape-height" min="0.9" max="1.4" step="0.02" value="1.12">
    </div>

    <div class="section-title">Spacing & Clearance Constraints</div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-row-spacing">Inter-Row Vertical Pitch</label>
        <span id="val-row-spacing">1.02</span>
      </div>
      <input type="range" id="param-row-spacing" min="0.90" max="1.25" step="0.01" value="1.02">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-min-gap">Minimum Character Separation Gap</label>
        <span id="val-min-gap">4px</span>
      </div>
      <input type="range" id="param-min-gap" min="1" max="12" step="1" value="4">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-tallness">Vertical Text Height (Scale Y)</label>
        <span id="val-tallness">1.12</span>
      </div>
      <input type="range" id="param-tallness" min="0.85" max="1.40" step="0.02" value="1.12">
    </div>

    <div class="section-title">Optical Wave Surface</div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-center-warp">Center Lens Bulge / Pinch</label>
        <span id="val-center-warp">0.30</span>
      </div>
      <input type="range" id="param-center-warp" min="0" max="0.70" step="0.02" value="0.30">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-amp">Wave Baseline Amplitude</label>
        <span id="val-amp">32</span>
      </div>
      <input type="range" id="param-amp" min="10" max="60" value="32">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-freq">Wave Frequency</label>
        <span id="val-freq">1.15</span>
      </div>
      <input type="range" id="param-freq" min="0.8" max="1.8" step="0.02" value="1.15">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-phase">Wave Phase Shift</label>
        <span id="val-phase">3.75</span>
      </div>
      <input type="range" id="param-phase" min="0" max="6.28" step="0.02" value="3.75">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-margin">Perimeter Boundary Inset</label>
        <span id="val-margin">38px</span>
      </div>
      <input type="range" id="param-margin" min="20" max="60" value="38">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="param-rotation">Overall Poster Tilt</label>
        <span id="val-rotation">-2.0°</span>
      </div>
      <input type="range" id="param-rotation" min="-10" max="10" step="0.5" value="-2.0">
    </div>

    <div class="toggle-row">
      <span>Invert Letters (Flip 180°)</span>
      <label class="toggle-switch">
        <input type="checkbox" id="param-invert">
        <span class="slider"></span>
      </label>
    </div>

    <div class="section-title">Color Palette</div>

    <div class="color-grid">
      <div class="color-field">
        <input type="color" id="param-bg" value="#050505">
        <label for="param-bg">Background</label>
      </div>
      <div class="color-field">
        <input type="color" id="param-ink" value="#D6D8D9">
        <label for="param-ink">Ink/Text</label>
      </div>
    </div>

    <div class="actions">
      <button onclick="exportSVG()" title="Export scalable vector SVG">Export SVG</button>
      <button class="primary" onclick="exportPDF()" title="Export vector PDF">Export PDF</button>
    </div>
  </aside>

  <main>
    <div class="poster-container">
      <svg id="poster-svg" viewBox="0 0 768 1086" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="poster-boundary-clip">
            <rect x="0" y="0" width="768" height="1086"/>
          </clipPath>
          <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Sora:wght@700;800&display=swap');
            .t-sora { font-family: 'Sora', sans-serif; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
            .t-mono { font-family: 'JetBrains Mono', monospace; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
            .t-meta { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 7.5px; letter-spacing: 0.12em; }
          </style>
        </defs>
        <rect id="svg-bg" width="768" height="1086" fill="#050505"/>
        <g clip-path="url(#poster-boundary-clip)">
          <g id="poster-root" transform-origin="384 543"></g>
        </g>
      </svg>
    </div>
  </main>

  <script>
    const ROWS_CONFIG = [
      {
        baseY: 92,
        fontSize: 64,
        fontType: 'sora',
        clusters: [
          { type: 'word', text: "AFISHA" },
          { type: 'top_reaching_spark', count: 2, scale: 0.95 },
          { type: 'word', text: "PICNIC" }
        ]
      },
      {
        baseY: 180,
        fontSize: 60,
        fontType: 'sora',
        clusters: [
          { type: 'pills', count: 3, w: 24, h: 44 },
          { type: 'word', text: "AFTERPARTY" },
          { type: 'disc', r: 25 }
        ]
      },
      {
        baseY: 268,
        fontSize: 58,
        fontType: 'sora',
        clusters: [
          { type: 'word', text: "25.07" },
          { type: 'moons', count: 2, dir: 1, r: 23 },
          { type: 'word', text: "23:00" },
          { type: 'cyrillic_badge', str: "«ПИКНИК", str2: "«АФИШИ»" }
        ]
      },
      {
        baseY: 356,
        fontSize: 60,
        fontType: 'sora',
        clusters: [
          { type: 'word', text: "STRELKA" },
          { type: 'spark', count: 5, scale: 0.90 }
        ]
      },
      {
        baseY: 446,
        fontSize: 60,
        fontType: 'sora',
        clusters: [
          { type: 'word', text: "MUJUICE" },
          { type: 'disc', r: 18 },
          { type: 'word', text: "DJ-SET" }
        ]
      },
      {
        baseY: 536,
        fontSize: 60,
        fontType: 'sora',
        clusters: [
          { type: 'word', text: "HOT" },
          { type: 'word', text: "CHIP" },
          { type: 'disc', r: 18 },
          { type: 'word', text: "DJ-SET" }
        ]
      },
      {
        baseY: 626,
        fontSize: 58,
        fontType: 'sora',
        clusters: [
          { type: 'word', text: "TOM" },
          { type: 'word', text: "FURSE" },
          { type: 'disc_sequence', count: 5, r: 16 }
        ]
      },
      {
        baseY: 716,
        fontSize: 58,
        fontType: 'sora',
        clusters: [
          { type: 'word', text: "THE" },
          { type: 'word', text: "HORRORS" },
          { type: 'moons', count: 3, dir: 1, r: 23 }
        ]
      },
      {
        baseY: 808,
        fontSize: 58,
        fontType: 'sora',
        clusters: [
          { type: 'moons', count: 5, dir: 1, r: 22 },
          { type: 'word', text: "DJ-SET" },
          { type: 'moons', count: 4, dir: 1, r: 22 }
        ]
      },
      {
        baseY: 902,
        fontSize: 62,
        fontType: 'sora',
        clusters: [
          { type: 'word', text: "PAHATAM" },
          { type: 'spark', count: 5, scale: 0.92 }
        ]
      },
      {
        baseY: 996,
        fontSize: 60,
        fontType: 'sora',
        clusters: [
          { type: 'disc', r: 15 },
          { type: 'pills', count: 2, w: 20, h: 40 },
          { type: 'word', text: "DJ-SET" },
          { type: 'pills', count: 6, w: 24, h: 46 }
        ]
      }
    ];

    function getParams() {
      return {
        shapeWidth: parseFloat(document.getElementById('param-shape-width').value),
        shapeHeight: parseFloat(document.getElementById('param-shape-height').value),
        rowSpacing: parseFloat(document.getElementById('param-row-spacing').value),
        minGap: parseFloat(document.getElementById('param-min-gap').value),
        tallness: parseFloat(document.getElementById('param-tallness').value),
        centerWarp: parseFloat(document.getElementById('param-center-warp').value),
        amp: parseFloat(document.getElementById('param-amp').value),
        freq: parseFloat(document.getElementById('param-freq').value),
        phase: parseFloat(document.getElementById('param-phase').value),
        margin: parseFloat(document.getElementById('param-margin').value),
        rotation: parseFloat(document.getElementById('param-rotation').value),
        invert: document.getElementById('param-invert').checked,
        bg: document.getElementById('param-bg').value,
        ink: document.getElementById('param-ink').value
      };
    }

    function evalMeshWarp(x, rowBaseY, W, H, rowIndex, p) {
      const u = x / W;
      const baseSpacing = 94 * p.rowSpacing;
      const calculatedRowY = 55 + (rowIndex * baseSpacing);
      
      const angle = (2 * Math.PI * p.freq * u) + p.phase;
      const waveY = p.amp * Math.sin(angle);

      const cx = W * 0.44;
      const cy = H * 0.50;
      const dx = x - cx;
      const dy = calculatedRowY - cy;
      const dist = Math.hypot(dx, dy);
      
      const maxRadius = 360;
      const normDist = Math.min(1.0, dist / maxRadius);
      const lensInfluence = Math.cos(normDist * Math.PI * 0.5);

      const stretchX = 1.0 + (p.centerWarp * 0.50 * Math.max(0, lensInfluence));
      const stretchY = 1.0 + (p.centerWarp * 0.40 * Math.max(0, lensInfluence));
      const radialPushY = dy * (p.centerWarp * 0.18 * lensInfluence);
      const shearAngle = Math.atan2(dy, dx) * (p.centerWarp * 0.12 * lensInfluence) * (180 / Math.PI);

      return {
        y: calculatedRowY + waveY + radialPushY,
        rotDeg: shearAngle,
        stretchX,
        stretchY,
        foreshorten: 1.0 + (0.12 * Math.sin(angle))
      };
    }

    function createSparkPath(cx, cy, scale, widthMultiplier) {
      const rx = 22 * scale * widthMultiplier;
      const ry = 38 * scale;
      return `M ${cx} ${cy - ry} Q ${cx} ${cy} ${cx + rx} ${cy} Q ${cx} ${cy} ${cx} ${cy + ry} Q ${cx} ${cy} ${cx - rx} ${cy} Q ${cx} ${cy} ${cx} ${cy - ry} Z`;
    }

    function createTopReachingSparkPath(cx, cy, scale, widthMultiplier, topCeilingY) {
      const rx = 24 * scale * widthMultiplier;
      const ryDown = 40 * scale;
      const ryUp = Math.max(ryDown, cy - topCeilingY);
      return `M ${cx} ${cy - ryUp} Q ${cx} ${cy} ${cx + rx} ${cy} Q ${cx} ${cy} ${cx} ${cy + ryDown} Q ${cx} ${cy} ${cx - rx} ${cy} Q ${cx} ${cy} ${cx} ${cy - ryUp} Z`;
    }

    function getCharWidth(ch, fontSize) {
      const wide = ['M', 'W', 'O', 'Q', 'D', 'G', '0', 'H'];
      const narrow = ['I', '1', ':', '.', '-', 'J', '«', '»'];
      if (wide.includes(ch)) return fontSize * 0.58;
      if (narrow.includes(ch)) return fontSize * 0.26;
      return fontSize * 0.44;
    }

    function renderPoster() {
      const p = getParams();
      const W = 768;
      const H = 1086;

      document.getElementById('val-shape-width').innerText = p.shapeWidth.toFixed(2);
      document.getElementById('val-shape-height').innerText = p.shapeHeight.toFixed(2);
      document.getElementById('val-row-spacing').innerText = p.rowSpacing.toFixed(2);
      document.getElementById('val-min-gap').innerText = p.minGap + 'px';
      document.getElementById('val-tallness').innerText = p.tallness.toFixed(2);
      document.getElementById('val-center-warp').innerText = p.centerWarp.toFixed(2);
      document.getElementById('val-amp').innerText = p.amp;
      document.getElementById('val-freq').innerText = p.freq.toFixed(2);
      document.getElementById('val-phase').innerText = p.phase.toFixed(2);
      document.getElementById('val-margin').innerText = p.margin + 'px';
      document.getElementById('val-rotation').innerText = p.rotation.toFixed(1) + '°';

      document.getElementById('svg-bg').setAttribute('fill', p.bg);
      const root = document.getElementById('poster-root');
      root.setAttribute('transform', `rotate(${p.rotation} ${W/2} ${H/2})`);
      root.innerHTML = '';

      const leftBoundary = p.margin;
      const rightBoundary = W - p.margin;
      const targetLineWidth = rightBoundary - leftBoundary;

      ROWS_CONFIG.forEach((row, rowIndex) => {
        let elements = [];

        row.clusters.forEach(cluster => {
          if (cluster.type === 'word') {
            const chars = cluster.text.split('');
            chars.forEach((c, cIdx) => {
              elements.push({
                kind: 'char',
                char: c,
                fontType: row.fontType,
                size: row.fontSize,
                baseW: getCharWidth(c, row.fontSize),
                isShape: false,
                clusterEnd: cIdx === chars.length - 1
              });
            });
          } else if (cluster.type === 'spark') {
            for (let i = 0; i < cluster.count; i++) {
              elements.push({
                kind: 'spark',
                scale: cluster.scale * p.shapeHeight,
                baseW: 38 * cluster.scale * p.shapeWidth,
                isShape: true,
                clusterEnd: i === cluster.count - 1
              });
            }
          } else if (cluster.type === 'top_reaching_spark') {
            for (let i = 0; i < cluster.count; i++) {
              elements.push({
                kind: 'top_reaching_spark',
                scale: cluster.scale * p.shapeHeight,
                baseW: 42 * cluster.scale * p.shapeWidth,
                isShape: true,
                clusterEnd: i === cluster.count - 1
              });
            }
          } else if (cluster.type === 'pills') {
            for (let i = 0; i < cluster.count; i++) {
              elements.push({
                kind: 'pill',
                w: cluster.w * p.shapeWidth,
                h: cluster.h * p.shapeHeight,
                baseW: cluster.w * p.shapeWidth,
                isShape: true,
                clusterEnd: i === cluster.count - 1
              });
            }
          } else if (cluster.type === 'disc') {
            elements.push({
              kind: 'disc',
              r: cluster.r * p.shapeHeight,
              baseW: cluster.r * 1.8 * p.shapeWidth,
              isShape: true,
              clusterEnd: true
            });
          } else if (cluster.type === 'disc_sequence') {
            for (let i = 0; i < cluster.count; i++) {
              elements.push({
                kind: 'disc',
                r: cluster.r * p.shapeHeight,
                baseW: cluster.r * 1.8 * p.shapeWidth,
                isShape: true,
                clusterEnd: i === cluster.count - 1
              });
            }
          } else if (cluster.type === 'moons') {
            for (let i = 0; i < cluster.count; i++) {
              elements.push({
                kind: 'moon',
                dir: cluster.dir,
                r: cluster.r * p.shapeHeight,
                baseW: cluster.r * 1.4 * p.shapeWidth,
                isShape: true,
                clusterEnd: i === cluster.count - 1
              });
            }
          } else if (cluster.type === 'cyrillic_badge') {
            elements.push({
              kind: 'cyrillic_badge',
              str: cluster.str,
              str2: cluster.str2,
              baseW: 70,
              isShape: false,
              clusterEnd: true
            });
          }
        });

        const N = elements.length;
        if (N === 0) return;

        // Subtle, balanced shape sizing: slightly wider and bigger without being drastic
        let naturalContentWidth = 0;
        elements.forEach((el, i) => {
          naturalContentWidth += el.baseW;
          if (i < N - 1) {
            naturalContentWidth += el.clusterEnd ? (p.minGap * 2) : p.minGap;
          }
        });

        const scaleFactor = targetLineWidth / (naturalContentWidth || 1);
        let curX = leftBoundary;

        elements.forEach((elem) => {
          const w = elem.baseW * scaleFactor;
          const xCenter = curX + (w / 2);

          const { y: warpedY, rotDeg, stretchX, stretchY, foreshorten } = evalMeshWarp(xCenter, row.baseY, W, H, rowIndex, p);

          let y = warpedY;
          if (rowIndex === 0) {
            y = Math.max(y, p.margin + (row.fontSize * 0.38));
          } else if (rowIndex === ROWS_CONFIG.length - 1) {
            y = Math.min(y, 1032 - (row.fontSize * 0.38));
          }

          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

          let tMatrix = `translate(${xCenter.toFixed(1)}, ${y.toFixed(1)})`;
          if (rotDeg !== 0) tMatrix += ` rotate(${rotDeg.toFixed(2)})`;

          let scaleX = (p.invert ? -1 : 1) * stretchX;
          let scaleY = (p.invert ? -1 : 1) * p.tallness * stretchY * foreshorten;
          tMatrix += ` scale(${scaleX.toFixed(3)}, ${scaleY.toFixed(3)})`;

          g.setAttribute('transform', tMatrix);

          if (elem.kind === 'char') {
            const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            txt.setAttribute('fill', p.ink);
            txt.setAttribute('class', elem.fontType === 'mono' ? 't-mono' : 't-sora');
            txt.setAttribute('font-size', elem.size);
            txt.textContent = elem.char;
            g.appendChild(txt);
          } else if (elem.kind === 'spark') {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute('d', createSparkPath(0, 0, elem.scale, p.shapeWidth));
            path.setAttribute('fill', p.ink);
            g.appendChild(path);
          } else if (elem.kind === 'top_reaching_spark') {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute('d', createTopReachingSparkPath(0, 0, elem.scale, p.shapeWidth, 2));
            path.setAttribute('fill', p.ink);
            g.appendChild(path);
          } else if (elem.kind === 'pill') {
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            const pw = elem.w;
            rect.setAttribute('x', -pw / 2);
            rect.setAttribute('y', -elem.h / 2);
            rect.setAttribute('width', pw);
            rect.setAttribute('height', elem.h);
            rect.setAttribute('rx', Math.min(pw / 2, 14));
            rect.setAttribute('fill', p.ink);
            g.appendChild(rect);
          } else if (elem.kind === 'disc') {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute('cx', 0);
            circle.setAttribute('cy', 0);
            circle.setAttribute('r', elem.r);
            circle.setAttribute('fill', p.ink);
            g.appendChild(circle);
          } else if (elem.kind === 'moon') {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const r = elem.r;
            const d = elem.dir > 0 
              ? `M 0 ${-r} A ${r} ${r} 0 0 1 0 ${r} Z` 
              : `M 0 ${-r} A ${r} ${r} 0 0 0 0 ${r} Z`;
            path.setAttribute('d', d);
            path.setAttribute('fill', p.ink);
            g.appendChild(path);
          } else if (elem.kind === 'cyrillic_badge') {
            const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t1.setAttribute('fill', p.ink);
            t1.setAttribute('class', 't-mono');
            t1.setAttribute('font-size', '16');
            t1.setAttribute('y', '-10');
            t1.textContent = elem.str;
            
            const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            t2.setAttribute('fill', p.ink);
            t2.setAttribute('class', 't-mono');
            t2.setAttribute('font-size', '16');
            t2.setAttribute('y', '12');
            t2.textContent = elem.str2;
            
            g.appendChild(t1);
            g.appendChild(t2);
          }

          root.appendChild(g);

          const gap = elem.clusterEnd ? (p.minGap * 2 * scaleFactor) : (p.minGap * scaleFactor);
          curX += w + gap;
        });
      });

      // Flat Anchored Footer Tier 3 Metadata
      const footerY = 1068;
      const footerG = document.createElementNS("http://www.w3.org/2000/svg", "g");
      footerG.setAttribute('fill', p.ink);
      footerG.setAttribute('class', 't-meta');

      const urlText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      urlText.setAttribute('x', Math.max(22, p.margin));
      urlText.setAttribute('y', footerY);
      urlText.textContent = "WWW.STRELKA.COM";

      const addrText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      addrText.setAttribute('x', W - Math.max(22, p.margin));
      addrText.setAttribute('y', footerY);
      addrText.setAttribute('text-anchor', 'end');
      addrText.textContent = "14, BLDG. 5A, BERSENEVSKAYA EMBANKMENT";

      footerG.appendChild(urlText);
      footerG.appendChild(addrText);
      root.appendChild(footerG);
    }

    function exportSVG() {
      const svg = document.getElementById('poster-svg');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svg);

      if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }

      const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `afisha-kinetic-poster-${Date.now()}.svg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: [297, 420]
      });

      const svgElement = document.getElementById('poster-svg');
      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svgElement);
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const URLObj = window.URL || window.webkitURL || window;
      const blobURL = URLObj.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 768 * 2;
        canvas.height = 1086 * 2;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const imgData = canvas.toDataURL('image/png');
        pdf.addImage(imgData, 'PNG', 0, 0, 297, 420);
        pdf.save(`afisha-kinetic-poster-${Date.now()}.pdf`);
        URLObj.revokeObjectURL(blobURL);
      };
      img.src = blobURL;
    }

    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => input.addEventListener('input', renderPoster));

    window.addEventListener('load', renderPoster);
  </script>
</body>
