<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Portfolio - Handoff Style</title>
    <!-- Google Fonts: Spicy Rice & PT Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Spicy+Rice&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #ff1a75;
            --primary-white: #ffffff;
            --accent-blue: #cce6ff;
            --burgundy: #800020;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--primary-pink);
            color: var(--primary-white);
            font-family: 'PT Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Mouse Spotlight Effect */
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle 250px at var(--x, 50%) var(--y, 50%), rgba(204, 230, 255, 0.25), transparent 80%);
            z-index: 99;
            transition: opacity 0.3s ease;
        }

        header {
            text-align: center;
            padding: 4rem 1rem 2rem;
        }

        h1 {
            font-family: 'Spicy Rice', cursive;
            font-size: clamp(3rem, 6vw, 5rem);
            color: var(--primary-white);
            margin-bottom: 0.5rem;
            text-shadow: 3px 3px var(--burgundy);
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--accent-blue);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Simple Layout Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem 5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            z-index: 2;
        }

        /* Section Item Card */
        .work-card {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid var(--accent-blue);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .work-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.18);
        }

        .work-title {
            font-family: 'Spicy Rice', cursive;
            font-size: 1.8rem;
            color: var(--primary-white);
            text-shadow: 2px 2px rgba(0, 0, 0, 0.15);
        }

        /* Buttons matching handoff.md specs */
        .btn {
            background-color: var(--accent-blue);
            color: var(--primary-pink);
            font-family: 'PT Sans', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0.75rem 1.75rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .btn:hover {
            background-color: var(--primary-pink);
            color: var(--accent-blue);
            border: 2px solid var(--accent-blue);
            transform: translateY(-2px);
        }

        /* Modal Lightbox */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border: 5px solid var(--accent-blue);
            border-radius: 12px;
            background: var(--primary-white);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: var(--accent-blue);
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Spicy Rice', cursive;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: var(--primary-pink);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .work-card {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="spotlight" id="spotlight"></div>

    <header>
        <h1>Design Portfolio</h1>
        <p class="subtitle">Creative Process & Assets</p>
    </header>

    <main class="container">
        <!-- Initial Sketches -->
        <div class="work-card">
            <span class="work-title">Initial Sketches</span>
            <button class="btn" onclick="openModal('sketchart.png', 'Initial Sketches')">Open Sketch Art</button>
        </div>

        <!-- Symbol Mapping 1 -->
        <div class="work-card">
            <span class="work-title">Symbol Mapping 1</span>
            <button class="btn" onclick="openModal('map1.png', 'Symbol Mapping 1')">Open Map 1</button>
        </div>

        <!-- Symbol Mapping 2 -->
        <div class="work-card">
            <span class="work-title">Symbol Mapping 2</span>
            <button class="btn" onclick="openModal('map2.png', 'Symbol Mapping 2')">Open Map 2</button>
        </div>

        <!-- Rapid Concept Generation -->
        <div class="work-card">
            <span class="work-title">Rapid Concept Generation</span>
            <button class="btn" onclick="openModal('badges.png', 'Rapid Concept Generation')">Open Badges</button>
        </div>

        <!-- Final Idea -->
        <div class="work-card">
            <span class="work-title">Final Idea</span>
            <button class="btn" onclick="openModal('finallogo.png', 'Final Idea')">Open Final Logo</button>
        </div>
    </main>

    <!-- Modal Lightbox Container -->
    <div id="imageModal" class="modal" onclick="closeModal(event)">
        <span class="close-modal" onclick="closeModalDirect()">&times;</span>
        <img class="modal-content" id="modalImg" alt="Enlarged View">
    </div>

    <script>
        /* Mouse Spotlight Follower */
        const spotlight = document.getElementById('spotlight');
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            spotlight.style.setProperty('--x', `${x}%`);
            spotlight.style.setProperty('--y', `${y}%`);
        });

        /* Modal Functions */
        function openModal(imageSrc, titleText) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'flex';
            modalImg.src = imageSrc;
            modalImg.alt = titleText;
        }

        function closeModal(event) {
            if (event.target.id === 'imageModal') {
                document.getElementById('imageModal').style.display = 'none';
            }
        }

        function closeModalDirect() {
            document.getElementById('imageModal').style.display = 'none';
        }

        /* Close on ESC key */
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('imageModal').style.display = 'none';
            }
        });
    </script>
</body>
</html>
