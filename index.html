<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.I. FOR DESIGNERS</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;animation:sky 60s linear infinite}@keyframes sky{0%{background:linear-gradient(#ffb6d9,#ffd6a5,#9370db,#4f46e5)}25%{background:linear-gradient(#87ceeb,#bfe9ff,#60a5fa,#2563eb)}50%{background:linear-gradient(#ff9966,#ffc870,#ff6ba6,#7c3aed)}75%{background:linear-gradient(#08122f,#1e3a8a,#1b1464,#020617)}100%{background:linear-gradient(#ffb6d9,#ffd6a5,#9370db,#4f46e5)}}.bg{position:fixed;inset:0;z-index:0}.sun{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fff9b0,#ffd84d,#ffae00);top:70px;right:10%;box-shadow:0 0 80px #ffd84d}.cloud{position:absolute;background:rgba(255,255,255,.82);border-radius:50px;height:50px}.cloud:before,.cloud:after{content:'';position:absolute;background:inherit;border-radius:50%}.cloud:before{width:60px;height:60px;left:15px;top:-25px}.cloud:after{width:80px;height:80px;right:15px;top:-35px}.c1{width:180px;top:120px;left:-220px;animation:drift1 120s linear infinite}.c2{width:220px;top:220px;left:-300px;animation:drift2 160s linear infinite}.c3{width:160px;top:90px;left:-180px;animation:drift3 140s linear infinite}@keyframes drift1{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 500px))}}@keyframes drift2{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 600px))}}@keyframes drift3{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 550px))}}.container{max-width:900px;margin:auto;padding:40px 24px;position:relative;z-index:2}h1{margin:0;font-size:clamp(3.5rem,9vw,7rem);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.8)}h2,.container div,a,.item{ text-shadow:0 1px 6px rgba(0,0,0,.8)}.skyline{position:fixed;bottom:0;left:0;width:100%;height:45vh;display:flex;align-items:flex-end;z-index:1}.building{background:#171717;margin-right:2px;position:relative}.window{position:absolute;width:8px;height:8px;background:#ffd84d;animation:blink 2.5s infinite}@keyframes blink{50%{opacity:.15}}.highlight .window{background:#fff799;box-shadow:0 0 12px #fff799;animation:none}.work{list-style:none;padding:0}.work li{margin:12px 0}.item{display:block;padding:14px 18px;background:rgba(20,20,20,.35);border:1px solid rgba(255,255,255,.35);border-radius:12px;color:#fff;text-decoration:none;backdrop-filter:blur(5px)}a{color:#fff}</style></head><body><div class="bg"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div><div class="skyline" id="skyline"></div><div class="container"><h1>A.I. FOR DESIGNERS — Sarah Inkateshta</h1><div>ART 3041 · Fall 2026</div><div><a href="mailto:sarah.inkateshta76@login.cuny.edu">sarah.inkateshta76@login.cuny.edu</a></div><h2>Work</h2><ol class="work"><li><a class="item" data-b="0" href="#">01 Custom Instructions</a></li><li><a class="item" data-b="1" href="#">02 A Style Guide for Your AI</a></li><li><a class="item" data-b="2" href="#">03 Design a ___</a></li><li><a class="item" data-b="3" href="#">04 Commute Story</a></li><li><a class="item" data-b="4" href="#">05 Become a Crea(i)tive Director</a></li><li><a class="item" data-b="5" href="#">06 Experimental AI Interface</a></li><li><a class="item" data-b="6" href="#">07 Open</a></li></ol></div><script>const s=document.getElementById('skyline'),b=[];[130,210,170,300,220,350,180,275,330,160,290,215,370,190].forEach((h,i)=>{let d=document.createElement('div');d.className='building';d.style.height=h+'px';d.style.width=(52+(i%4)*18)+'px';for(let y=12;y<h-15;y+=18){for(let x=8;x<parseInt(d.style.width)-8;x+=14){if(Math.random()>.35){let w=document.createElement('div');w.className='window';w.style.left=x+'px';w.style.top=y+'px';d.appendChild(w)}}}s.appendChild(d);b.push(d)});document.querySelectorAll('.item').forEach(e=>{e.onmouseenter=()=>{b.forEach(x=>x.classList.remove('highlight'));b[+e.dataset.b].classList.add('highlight')};e.onmouseleave=()=>b.forEach(x=>x.classList.remove('highlight'))});</script></body></html>
